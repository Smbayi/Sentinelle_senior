<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertes - Sentinel Senior</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fa; }
        .navbar { background: linear-gradient(135deg, #2c5aa0 0%, #4a90e2 100%); }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
        .alerte-card { border-left: 4px solid; margin-bottom: 1rem; }
        .alerte-faible { border-left-color: #17a2b8; }
        .alerte-moyen { border-left-color: #ffc107; }
        .alerte-eleve { border-left-color: #fd7e14; }
        .alerte-critique { border-left-color: #dc3545; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-shield-check"></i> Sentinel Senior</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Accueil</a>
                <a class="nav-link" href="/patients">Patients</a>
                <a class="nav-link" href="/evaluations">Évaluations</a>
                <a class="nav-link active" href="/alertes">Alertes</a>
                <a class="nav-link" href="/statistiques">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-bell"></i> Alertes de Fragilité</h1>
            <div>
                <button class="btn btn-outline-secondary" onclick="loadAlertes(false)">
                    <i class="bi bi-check-circle"></i> Non traitées
                </button>
                <button class="btn btn-outline-secondary" onclick="loadAlertes(true)">
                    <i class="bi bi-check-all"></i> Toutes
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div id="alertesContainer">
                    <div class="text-center">Chargement...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Traitement Alerte -->
    <div class="modal fade" id="modalTraitement" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Traiter l'alerte</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formTraitement">
                        <input type="hidden" id="alerteId" name="alerte_id">
                        <div class="mb-3">
                            <label class="form-label">Action prise *</label>
                            <textarea class="form-control" id="actionPrise" name="action_prise" rows="4" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" onclick="traiterAlerte()">Marquer comme traitée</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let patients = [];
        let showAll = false;

        document.addEventListener('DOMContentLoaded', () => {
            loadPatients();
            loadAlertes(false);
        });

        async function loadPatients() {
            try {
                const response = await fetch('/api/patients');
                patients = await response.json();
            } catch (error) {
                console.error('Erreur:', error);
            }
        }

        async function loadAlertes(showAllAlertes) {
            showAll = showAllAlertes;
            const url = showAllAlertes ? '/api/alertes/non-traitees' : '/api/alertes/non-traitees';
            
            try {
                const response = await fetch(url);
                const alertes = await response.json();
                
                const container = document.getElementById('alertesContainer');
                
                if (alertes.length === 0) {
                    container.innerHTML = '<div class="text-center text-muted">Aucune alerte non traitée</div>';
                    return;
                }
                
                // Trier par niveau de priorité
                const niveauOrder = { 'critique': 0, 'eleve': 1, 'moyen': 2, 'faible': 3 };
                alertes.sort((a, b) => niveauOrder[a.niveau] - niveauOrder[b.niveau]);
                
                container.innerHTML = alertes.map(a => {
                    const patient = patients.find(p => p.id === a.patient_id);
                    const niveauClass = `alerte-${a.niveau}`;
                    const badgeClass = a.niveau === 'critique' ? 'bg-danger' :
                                     a.niveau === 'eleve' ? 'bg-warning' :
                                     a.niveau === 'moyen' ? 'bg-info' : 'bg-secondary';
                    
                    return `
                        <div class="card alerte-card ${niveauClass}">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div class="flex-grow-1">
                                        <div class="d-flex align-items-center mb-2">
                                            <span class="badge ${badgeClass} me-2">${a.niveau.toUpperCase()}</span>
                                            <span class="badge bg-dark">${a.type_alerte}</span>
                                        </div>
                                        <h6 class="mb-2">${patient ? `${patient.prenom} ${patient.nom}` : 'Patient #' + a.patient_id}</h6>
                                        <p class="mb-2">${a.message}</p>
                                        <small class="text-muted">
                                            <i class="bi bi-clock"></i> ${new Date(a.date_alerte).toLocaleString('fr-FR')}
                                        </small>
                                    </div>
                                    ${!a.traitee ? `
                                        <button class="btn btn-sm btn-primary" onclick="ouvrirModalTraitement(${a.id})">
                                            <i class="bi bi-check-circle"></i> Traiter
                                        </button>
                                    ` : `
                                        <span class="badge bg-success">Traité</span>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('alertesContainer').innerHTML = 
                    '<div class="text-center text-danger">Erreur lors du chargement</div>';
            }
        }

        function ouvrirModalTraitement(alerteId) {
            document.getElementById('alerteId').value = alerteId;
            document.getElementById('actionPrise').value = '';
            const modal = new bootstrap.Modal(document.getElementById('modalTraitement'));
            modal.show();
        }

        async function traiterAlerte() {
            const alerteId = document.getElementById('alerteId').value;
            const actionPrise = document.getElementById('actionPrise').value;
            
            if (!actionPrise.trim()) {
                alert('Veuillez indiquer l\'action prise');
                return;
            }
            
            try {
                const response = await fetch(`/api/alertes/${alerteId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action_prise: actionPrise })
                });
                
                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('modalTraitement'));
                    modal.hide();
                    loadAlertes(showAll);
                    alert('Alerte traitée avec succès!');
                } else {
                    alert('Erreur lors du traitement');
                }
            } catch (error) {
                alert('Erreur lors du traitement');
                console.error(error);
            }
        }
    </script>
</body>
</html>
