<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Patients - Sentinel Senior</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fa; }
        .navbar { background: linear-gradient(135deg, #2c5aa0 0%, #4a90e2 100%); }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
        .btn-primary { background-color: #2c5aa0; border: none; }
        .btn-primary:hover { background-color: #1e3f73; }
        .table-hover tbody tr:hover { background-color: #f8f9fa; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-shield-check"></i> Sentinel Senior</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Accueil</a>
                <a class="nav-link active" href="/patients">Patients</a>
                <a class="nav-link" href="/evaluations">Évaluations</a>
                <a class="nav-link" href="/alertes">Alertes</a>
                <a class="nav-link" href="/statistiques">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-people"></i> Gestion des Patients</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPatient">
                <i class="bi bi-person-plus"></i> Nouveau Patient
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="tablePatients">
                        <thead>
                            <tr>
                                <th>Nom</th>
                                <th>Prénom</th>
                                <th>Âge</th>
                                <th>Sexe</th>
                                <th>Téléphone</th>
                                <th>Date Inscription</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="patientsBody">
                            <tr><td colspan="7" class="text-center">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nouveau Patient -->
    <div class="modal fade" id="modalPatient" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nouveau Patient</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formPatient">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nom *</label>
                                <input type="text" class="form-control" name="nom" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Prénom *</label>
                                <input type="text" class="form-control" name="prenom" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date de Naissance *</label>
                                <input type="date" class="form-control" name="date_naissance" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Sexe *</label>
                                <select class="form-select" name="sexe" required>
                                    <option value="">Sélectionner...</option>
                                    <option value="M">Masculin</option>
                                    <option value="F">Féminin</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Téléphone</label>
                            <input type="tel" class="form-control" name="telephone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Adresse</label>
                            <textarea class="form-control" name="adresse" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notes Médicales</label>
                            <textarea class="form-control" name="notes_medicales" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" onclick="savePatient()">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Charger les patients au chargement de la page
        document.addEventListener('DOMContentLoaded', loadPatients);

        async function loadPatients() {
            try {
                const response = await fetch('/api/patients');
                const patients = await response.json();
                
                const tbody = document.getElementById('patientsBody');
                if (patients.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Aucun patient enregistré</td></tr>';
                    return;
                }
                
                tbody.innerHTML = patients.map(p => `
                    <tr onclick="viewPatient(${p.id})">
                        <td>${p.nom}</td>
                        <td>${p.prenom}</td>
                        <td>${p.age} ans</td>
                        <td>${p.sexe === 'M' ? 'Masculin' : 'Féminin'}</td>
                        <td>${p.telephone || '-'}</td>
                        <td>${new Date(p.date_inscription).toLocaleDateString('fr-FR')}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); viewPatient(${p.id})">
                                <i class="bi bi-eye"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('patientsBody').innerHTML = 
                    '<tr><td colspan="7" class="text-center text-danger">Erreur lors du chargement</td></tr>';
            }
        }

        async function savePatient() {
            const form = document.getElementById('formPatient');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('/api/patients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('modalPatient'));
                    modal.hide();
                    form.reset();
                    loadPatients();
                    alert('Patient enregistré avec succès!');
                } else {
                    const error = await response.json();
                    alert('Erreur: ' + error.error);
                }
            } catch (error) {
                alert('Erreur lors de l\'enregistrement');
                console.error(error);
            }
        }

        function viewPatient(id) {
            window.location.href = `/patients/${id}`;
        }
    </script>
</body>
</html>
